[project]
name = "vit-layernorm-vs-dyt"
version = "0.1.0"
description = "An experimental comparison of ViT (LayerNorm) and ViT (DyT) on the CIFAR-10 dataset."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "codecarbon>=3.3.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "psutil>=7.2.2",
    "seaborn>=0.13.2",
    "thop>=0.1.1.post2209072238",
    "timm>=1.0.30",
    "torch>=2.4.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.19.0",
    "tqdm>=4.70.1",
    "wandb>=0.30.0",
    "triton",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.4.1",
]

[tool.black]
line-length = 96

[[tool.uv.index]]
name = "pytorch-nightly"
url = "https://download.pytorch.org/whl/nightly/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-nightly" }
torchvision = { index = "pytorch-nightly" }
triton = { index = "pytorch-nightly" }
